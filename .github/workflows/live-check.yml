# Prüft die LIVE-Seite (Erreichbarkeit, Zertifikat, Seiten, API-Konfiguration, gesperrte Dateien, SPF/DMARC/MX)
# und sagt bei Fehlern, was zu tun ist. Läuft automatisch nach jedem erfolgreichen Deploy, täglich um 06:17 UTC
# (fällt die Seite aus, mailt GitHub den Fehlschlag) oder von Hand: Actions → Live-Check → Run workflow.
name: Live-Check
on:
  workflow_dispatch:
    inputs:
      url:
        description: Adresse der Seite
        default: https://gluephs.com
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  schedule:
    - cron: '17 6 * * *'
# Minimale Rechte für das GITHUB_TOKEN (Audit 2026-10-16); Actions auf Commit-SHA gepinnt (Tags lassen sich umbiegen), Updates via .github/dependabot.yml
permissions:
  contents: read
jobs:
  check:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Kurz warten (Server übernimmt die Dateien)
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 20
      - name: Live-Check
        env:
          URL: ${{ github.event.inputs.url || 'https://gluephs.com' }} # über env statt direkt im Skript (keine Shell-Injection über die Eingabe)
        run: |
          case "$URL" in https://*) ;; *) echo "Nur https-Adressen"; exit 1 ;; esac
          node scripts/live-check.js "$URL"
