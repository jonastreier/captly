<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · CaptionRush</title>
<style>
  :root{--ink:#16181d;--muted:#5d6470;--brand:#7c3aed;--bg:#f5f7f8;--card:#fff;--line:#e3e7ea}
  @media (prefers-color-scheme:dark){:root{--ink:#f2f3f5;--muted:#a0a7b3;--bg:#14161a;--card:#1c1f25;--line:#2b2f37}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:420px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 24px;text-align:center}
  h1{margin:0 0 8px;font-size:22px}
  p{margin:0 0 20px;color:var(--muted)}
  a{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:10px}
  small{display:block;margin-top:16px}
  small a{background:none;color:var(--brand);padding:0;font-weight:500}
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>This page doesn't exist. Caption your video instead.</p>
  <a href="/">Go to CaptionRush</a>
  <small><a href="/de">Zur deutschen Startseite · Seite nicht gefunden</a></small>
</main>
</body>
</html>
